name: Documentation

on:
  push:
    branches: [main, develop, 'feat/**']
    paths:
      - 'docs/**'
      - 'include/xgl/**'
      - 'tools/documentation/**'
      - 'dependencies/docs*'
      - 'cmake/**'
      - Doxyfile
      - CMakeLists.txt
      - .github/workflows/pages.yml
  pull_request:
    branches: [main, develop]
  workflow_dispatch:

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build-docs:
    name: Build documentation site
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Prepare hash-locked documentation tools
        run: |
          mkdir -p build/docs-diagnostics
          python -B tools/documentation/install.py \
            --prefix "$RUNNER_TEMP/xgl-docs-tools" \
            --cache "$RUNNER_TEMP/xgl-docs-cache" --allow-network \
            2>&1 | tee build/docs-diagnostics/prepare.log
      - name: Verify the documentation tools
        run: |
          python -B tools/documentation/cli.py test --tool-prefix "$RUNNER_TEMP/xgl-docs-tools" \
            2>&1 | tee build/docs-diagnostics/tests.log
      - name: Build both languages and check the site
        run: |
          python -B tools/documentation/cli.py build --tool-prefix "$RUNNER_TEMP/xgl-docs-tools" \
            --mode verify --language all --output build/documentation
          test -s build/documentation/documentation-build.json
          test -s build/documentation/site/source.json
      - name: Preserve the verified documentation site
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: documentation
          path: |
            build/documentation/site/
            build/documentation/documentation-build.json
            build/docs-diagnostics/
            ${{ runner.temp }}/xgl-docs-tools/installation.json
          include-hidden-files: true
          if-no-files-found: error
      - name: Upload the same verified site for Pages
        if: >-
          github.ref == 'refs/heads/main'
          && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: build/documentation/site
      - name: Preserve documentation failure evidence
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: documentation-diagnostics
          path: |
            build/docs-diagnostics/
            build/documentation/documentation-build.json
            build/documentation/attempt-*/build.json
            build/documentation/attempt-*/*.log
            build/documentation/attempt-*/source-check.json
            build/documentation/attempt-*/doxygen/warnings.log
          if-no-files-found: warn

  deploy:
    name: Deploy to GitHub Pages
    if: >-
      github.ref == 'refs/heads/main'
      && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    needs: build-docs
    runs-on: ubuntu-24.04
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
