name: Deploy Docs

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build-docs:
    name: Build documentation site
    runs-on: ubuntu-24.04
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            cmake \
            g++ \
            gcc \
            graphviz \
            ninja-build

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: docs/requirements.txt

      - name: Prepare shared quality policy and fixed Doxygen
        uses: ./.github/actions/setup-quality
        with:
          repository: ${{ vars.XGEN_QUALITY_REPOSITORY }}
          native-analyzers: 'true'

      - name: Install documentation dependencies
        run: python -m pip install -r docs/requirements.txt

      - name: Run documentation QA
        shell: pwsh
        run: ./tools/docs_qa.ps1

      - name: Prepare fixed component sources
        uses: ./.github/actions/setup-components
        with:
          status-repository: ${{ vars.XGEN_STATUS_REPOSITORY }}
          bytes-repository: ${{ vars.XGEN_BYTES_REPOSITORY }}
          crc-repository: ${{ vars.XGEN_CRC_REPOSITORY }}
          memory-repository: ${{ vars.XGEN_MEMORY_REPOSITORY }}
          containers-repository: ${{ vars.XGEN_CONTAINERS_REPOSITORY }}

      - name: Configure
        run: cmake -S dev --preset docs

      - name: Validate public API documentation
        run: python tools/quality.py docs

      - name: Build MkDocs and Doxygen
        run: cmake --build build/dev-docs --target xgl_docs --parallel

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: build/dev-docs/link/docs/site

  deploy:
    name: Deploy to GitHub Pages
    needs: build-docs
    runs-on: ubuntu-24.04
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
