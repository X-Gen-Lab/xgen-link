name: Documentation

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
      - develop
  workflow_dispatch:

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build-docs:
    name: Build documentation site
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
      pages: read

    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: docs/requirements.txt

      - name: Install documentation dependencies
        run: |
          python -m pip install -r docs/requirements.txt
          doxygen_archive="$RUNNER_TEMP/doxygen-1.14.0.linux.bin.tar.gz"
          curl --fail --location --retry 3 \
            https://github.com/doxygen/doxygen/releases/download/Release_1_14_0/doxygen-1.14.0.linux.bin.tar.gz \
            --output "$doxygen_archive"
          echo "e5d6ae24d0bf3f0cdc4d8f146726b89ca323922f19441af99b1872d503665ad6  $doxygen_archive" | sha256sum --check
          tar -xzf "$doxygen_archive" -C "$RUNNER_TEMP"
          echo "$RUNNER_TEMP/doxygen-1.14.0/bin" >> "$GITHUB_PATH"

      - name: Run documentation QA
        shell: pwsh
        run: ./tools/docs_qa.ps1

      - name: Build MkDocs and Doxygen
        run: |
          cmake -S docs -B build/docs
          cmake --build build/docs --target xgl_docs

      - name: Configure GitHub Pages
        if: github.ref == 'refs/heads/main'
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        if: github.ref == 'refs/heads/main'
        uses: actions/upload-pages-artifact@v3
        with:
          path: build/docs/site

  deploy:
    name: Deploy to GitHub Pages
    if: github.ref == 'refs/heads/main'
    needs: build-docs
    runs-on: ubuntu-24.04
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
