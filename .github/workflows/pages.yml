name: Documentation

on:
  push:
    branches:
      - main
      - 'feat/**'
    paths:
      - 'docs/**'
      - 'include/xgl/**'
      - CMakeLists.txt
      - cmake/XglVersion.cmake
      - Doxyfile
      - mkdocs.yml
      - tools/docs_qa.ps1
      - .github/workflows/pages.yml
  pull_request:
    branches:
      - main
      - develop
  workflow_dispatch:

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build-docs:
    name: Build documentation site
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
      pages: read
    defaults:
      run:
        shell: bash

    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: docs/requirements.txt

      - name: Install documentation dependencies
        run: |
          mkdir -p build/docs-diagnostics
          (
            set -euo pipefail
            python -m pip install -r docs/requirements.txt
            doxygen_archive="$RUNNER_TEMP/doxygen-1.14.0.linux.bin.tar.gz"
            curl --fail --location --retry 3 \
              https://github.com/doxygen/doxygen/releases/download/Release_1_14_0/doxygen-1.14.0.linux.bin.tar.gz \
              --output "$doxygen_archive"
            echo "e5d6ae24d0bf3f0cdc4d8f146726b89ca323922f19441af99b1872d503665ad6  $doxygen_archive" | sha256sum --check
            tar -xzf "$doxygen_archive" -C "$RUNNER_TEMP"
            echo "$RUNNER_TEMP/doxygen-1.14.0/bin" >> "$GITHUB_PATH"
          ) 2>&1 | tee build/docs-diagnostics/dependencies.log

      - name: Record documentation tool versions
        run: |
          (
            set -euo pipefail
            python --version
            python -m pip show mkdocs mkdocs-material
            cmake --version
            doxygen --version
            pwsh --version
          ) 2>&1 | tee build/docs-diagnostics/tool-versions.log

      - name: Run documentation QA
        run: pwsh -NoProfile -File tools/docs_qa.ps1 2>&1 | tee build/docs-diagnostics/qa.log

      - name: Build MkDocs and Doxygen
        run: |
          cmake -S docs -B build/docs 2>&1 | tee build/docs-diagnostics/configure.log
          cmake --build build/docs --target xgl_docs 2>&1 | tee build/docs-diagnostics/build.log

      - name: Configure GitHub Pages
        if: github.ref == 'refs/heads/main'
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        if: github.ref == 'refs/heads/main'
        uses: actions/upload-pages-artifact@v3
        with:
          path: build/docs/site

      - name: Preserve documentation failure evidence
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: documentation-diagnostics
          path: |
            build/docs-diagnostics/
            build/docs/doxygen/warnings.log
          if-no-files-found: warn

  deploy:
    name: Deploy to GitHub Pages
    if: github.ref == 'refs/heads/main'
    needs: build-docs
    runs-on: ubuntu-24.04
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
