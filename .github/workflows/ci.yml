name: CI

on:
  push:
    branches: [main, develop, 'feat/**']
  pull_request:
    branches: [main, develop]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  host:
    name: Host (${{ matrix.os }}, advanced=${{ matrix.advanced }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2022, macos-15]
        advanced: ['OFF', 'ON']
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'
      - name: Prepare MSVC
        if: runner.os == 'Windows'
        uses: ilammy/msvc-dev-cmd@a102174a2b586eec2ea151a69e6fd14404a8ce7c # v1.13.0
      - uses: ./.github/actions/setup-quality
        with:
          repository: ${{ vars.XGEN_QUALITY_REPOSITORY }}
      - uses: ./.github/actions/setup-components
        with:
          status-repository: ${{ vars.XGEN_STATUS_REPOSITORY }}
          bytes-repository: ${{ vars.XGEN_BYTES_REPOSITORY }}
          crc-repository: ${{ vars.XGEN_CRC_REPOSITORY }}
          memory-repository: ${{ vars.XGEN_MEMORY_REPOSITORY }}
          containers-repository: ${{ vars.XGEN_CONTAINERS_REPOSITORY }}
      - uses: ./.github/actions/setup-gtest
      - name: Text and source layout
        run: |
          python tools/quality.py text
          python tools/quality.py format
          python -m pre_commit run --all-files
      - name: Native C++17 build and individual CTest execution
        run: |
          cmake -S dev --preset debug -DXGL_ENABLE_ADVANCED_RUNTIME=${{ matrix.advanced }}
          cmake --build build/dev-debug --parallel 2
          python tools/quality.py test --build-dir build/dev-debug
      - name: Verify language, discovery and seed replay contracts
        run: |
          binary=build/dev-debug/link/test/xgl_tests
          if [[ "$RUNNER_OS" == Windows ]]; then binary+=.exe; fi
          python test/cmake/test_runner_contracts.py --build-dir build/dev-debug --binary "$binary"
      - name: Preserve host evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: host-${{ matrix.os }}-${{ matrix.advanced }}
          path: |
            out/reports/
            build/dev-debug/Testing/
            build/dev-debug/compile_commands.json
          if-no-files-found: error

  analysis:
    name: Analysis, API documentation and coverage
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - uses: ./.github/actions/setup-quality
        with:
          repository: ${{ vars.XGEN_QUALITY_REPOSITORY }}
          native-analyzers: 'true'
      - uses: ./.github/actions/setup-components
        with:
          status-repository: ${{ vars.XGEN_STATUS_REPOSITORY }}
          bytes-repository: ${{ vars.XGEN_BYTES_REPOSITORY }}
          crc-repository: ${{ vars.XGEN_CRC_REPOSITORY }}
          memory-repository: ${{ vars.XGEN_MEMORY_REPOSITORY }}
          containers-repository: ${{ vars.XGEN_CONTAINERS_REPOSITORY }}
      - uses: ./.github/actions/setup-gtest
      - run: python -m pip install -r docs/requirements.txt
      - name: Documentation navigation
        shell: pwsh
        run: ./tools/docs_qa.ps1
      - name: Build instrumented real protocol
        run: |
          cmake -S dev --preset ci -DXGL_ENABLE_ADVANCED_RUNTIME=ON
          cmake --build build/dev-ci --parallel 2
          python tools/quality.py test --build-dir build/dev-ci
      - name: Cppcheck through the shared CMake target
        run: cmake --build build/dev-ci --target xgl_static_analysis
      - name: Clang-Tidy and strict public API documentation
        run: |
          python tools/quality.py tidy --build-dir build/dev-ci
          python tools/quality.py docs
      - name: Require each production coverage metric to reach 80 percent
        run: python tools/quality.py coverage --build-dir build/dev-ci
      - name: Validate release composition and build documentation site
        run: cmake --build build/dev-ci --target xgl_release_validation --parallel 2
      - name: Preserve analysis evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: analysis-coverage-release
          path: |
            out/reports/
            build/dev-ci/Testing/
            build/dev-ci/compile_commands.json
            build/dev-ci/link/docs/doxygen/warnings.log
            build/dev-ci/link/footprint/
          if-no-files-found: error

  sanitizers:
    name: Address and undefined behavior sanitizers
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - uses: ./.github/actions/setup-quality
        with:
          repository: ${{ vars.XGEN_QUALITY_REPOSITORY }}
      - uses: ./.github/actions/setup-components
        with:
          status-repository: ${{ vars.XGEN_STATUS_REPOSITORY }}
          bytes-repository: ${{ vars.XGEN_BYTES_REPOSITORY }}
          crc-repository: ${{ vars.XGEN_CRC_REPOSITORY }}
          memory-repository: ${{ vars.XGEN_MEMORY_REPOSITORY }}
          containers-repository: ${{ vars.XGEN_CONTAINERS_REPOSITORY }}
      - uses: ./.github/actions/setup-gtest
      - name: Build and check every selected executable
        run: |
          cmake -S dev --preset asan -DXGL_ENABLE_ADVANCED_RUNTIME=ON
          cmake --build build/dev-asan --parallel 2
          python tools/quality.py test --build-dir build/dev-asan
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: sanitizers
          path: out/reports/
          if-no-files-found: error

  bounded-profiles:
    name: Bounded profile (${{ matrix.profile }}, advanced=${{ matrix.advanced }})
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        profile: [boot, embedded-lite, embedded]
        advanced: ['OFF', 'ON']
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - uses: ./.github/actions/setup-quality
        with:
          repository: ${{ vars.XGEN_QUALITY_REPOSITORY }}
      - uses: ./.github/actions/setup-components
        with:
          status-repository: ${{ vars.XGEN_STATUS_REPOSITORY }}
          bytes-repository: ${{ vars.XGEN_BYTES_REPOSITORY }}
          crc-repository: ${{ vars.XGEN_CRC_REPOSITORY }}
          memory-repository: ${{ vars.XGEN_MEMORY_REPOSITORY }}
          containers-repository: ${{ vars.XGEN_CONTAINERS_REPOSITORY }}
      - uses: ./.github/actions/setup-gtest
      - run: cmake -S dev --preset ${{ matrix.profile }}-host-test -DXGL_ENABLE_ADVANCED_RUNTIME=${{ matrix.advanced }}
      - run: cmake --build build/dev-${{ matrix.profile }}-host-test --parallel 2
      - run: python tools/quality.py test --build-dir build/dev-${{ matrix.profile }}-host-test --config MinSizeRel
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: bounded-${{ matrix.profile }}-${{ matrix.advanced }}
          path: |
            out/reports/
            build/dev-${{ matrix.profile }}-host-test/Testing/
          if-no-files-found: error

  dependency-contracts:
    name: Production dependency contracts
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - uses: ./.github/actions/setup-components
        with:
          status-repository: ${{ vars.XGEN_STATUS_REPOSITORY }}
          bytes-repository: ${{ vars.XGEN_BYTES_REPOSITORY }}
          crc-repository: ${{ vars.XGEN_CRC_REPOSITORY }}
          memory-repository: ${{ vars.XGEN_MEMORY_REPOSITORY }}
          containers-repository: ${{ vars.XGEN_CONTAINERS_REPOSITORY }}
      - uses: ./.github/actions/setup-gtest
      - name: Check explicit development preparation
        run: |
          python -m unittest discover -s dev/tests -v
          python test/cmake/test_discovery_policy.py
          python test/cmake/test_delivery_presets.py --work-dir out/reports/delivery-presets
          python test/cmake/test_footprint_budget.py
          python test/cmake/test_footprint_storage.py
          python test/cmake/test_footprint_report.py
      - name: Validate real source and package consumers
        run: |
          python test/cmake/dependency_contracts.py \
            --link-source . --status-source out/deps/xgen-status \
            --bytes-source out/deps/xgen-bytes --crc-source out/deps/xgen-crc \
            --memory-source out/deps/xgen-memory --containers-source out/deps/xgen-containers \
            --work-dir out/reports/dependency-contracts
      - name: Validate profiles, package capabilities and Debug/Release consumers
        run: |
          python test/cmake/test_profile_builds.py \
            --link-source . --status-source out/deps/xgen-status \
            --bytes-source out/deps/xgen-bytes --crc-source out/deps/xgen-crc \
            --memory-source out/deps/xgen-memory --containers-source out/deps/xgen-containers \
            --work-dir out/reports/profile-contracts
      - name: Validate bounded RX chunk selection and installed configuration
        run: |
          python test/cmake/test_rx_chunk_config.py \
            --link-source . --status-source out/deps/xgen-status \
            --bytes-source out/deps/xgen-bytes --crc-source out/deps/xgen-crc \
            --memory-source out/deps/xgen-memory --containers-source out/deps/xgen-containers \
            --work-dir out/reports/rx-chunk-contracts
      - name: Validate transport capacities, identity and fixed RTO consumers
        run: |
          python test/cmake/test_transport_resource_config.py \
            --link-source . --status-source out/deps/xgen-status \
            --bytes-source out/deps/xgen-bytes --crc-source out/deps/xgen-crc \
            --memory-source out/deps/xgen-memory --containers-source out/deps/xgen-containers \
            --gtest-dir "$GTest_ROOT/lib/cmake/GTest" \
            --work-dir out/reports/transport-resource-contracts
      - name: Preserve contract results
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: dependency-contracts
          path: |
            out/reports/dependency-contracts
            out/reports/profile-contracts
            out/reports/rx-chunk-contracts
            out/reports/transport-resource-contracts
            out/reports/delivery-presets
          if-no-files-found: error

  arm-footprint:
    name: Cortex-M0 ELF budget (${{ matrix.resource }}, MTU ${{ matrix.mtu }}, LTO ${{ matrix.lto }})
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        mtu: [128, 64]
        lto: ['OFF', 'ON']
        resource: ['default', 'small']
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - uses: ./.github/actions/setup-components
        with:
          status-repository: ${{ vars.XGEN_STATUS_REPOSITORY }}
          bytes-repository: ${{ vars.XGEN_BYTES_REPOSITORY }}
          crc-repository: ${{ vars.XGEN_CRC_REPOSITORY }}
          memory-repository: ${{ vars.XGEN_MEMORY_REPOSITORY }}
          containers-repository: ${{ vars.XGEN_CONTAINERS_REPOSITORY }}
      - uses: ./.github/actions/setup-arm-toolchain
      - name: Validate explicit LTO mode and budget contracts
        if: matrix.resource == 'default' && matrix.mtu == 128 && matrix.lto == 'OFF'
        run: |
          python test/cmake/test_footprint_lto.py \
            --link-source . --status-source "$XGL_DEV_STATUS_SOURCE_DIR" \
            --bytes-source "$XGL_DEV_BYTES_SOURCE_DIR" --crc-source "$XGL_DEV_CRC_SOURCE_DIR" \
            --memory-source "$XGL_DEV_MEMORY_SOURCE_DIR" --containers-source "$XGL_DEV_CONTAINERS_SOURCE_DIR" \
            --work-dir out/footprint-lto-contracts
          python test/cmake/test_footprint_advanced.py \
            --link-source . --status-source "$XGL_DEV_STATUS_SOURCE_DIR" \
            --bytes-source "$XGL_DEV_BYTES_SOURCE_DIR" --crc-source "$XGL_DEV_CRC_SOURCE_DIR" \
            --memory-source "$XGL_DEV_MEMORY_SOURCE_DIR" --containers-source "$XGL_DEV_CONTAINERS_SOURCE_DIR" \
            --work-dir out/footprint-advanced-contracts
      - name: Link the fixed no-heap Boot consumer
        run: |
          cmake -S tools/boot_footprint -B out/arm-${{ matrix.resource }}-${{ matrix.mtu }}-${{ matrix.lto }} -G Ninja \
            -DCMAKE_TOOLCHAIN_FILE="$GITHUB_WORKSPACE/tools/boot_footprint/toolchain-arm-cortex-m0.cmake" \
            -DCMAKE_BUILD_TYPE=MinSizeRel \
            -DXGL_FOOTPRINT_LTO=${{ matrix.lto }} \
            -DXGL_FOOTPRINT_FRAME_SIZE=${{ matrix.mtu }} -DXGL_FOOTPRINT_RX_SIZE=${{ matrix.mtu }} \
            -DXGL_RELIABLE_INDEX_BUCKETS=1 \
            -DXGL_TRANSPORT_WINDOW_CAPACITY=${{ matrix.resource == 'small' && '1' || '128' }} \
            -DXGL_ENABLE_ADAPTIVE_RTO=${{ matrix.resource == 'small' && 'OFF' || 'ON' }} \
            -DXGL_DEV_STATUS_SOURCE_DIR="$XGL_DEV_STATUS_SOURCE_DIR" \
            -DXGL_DEV_BYTES_SOURCE_DIR="$XGL_DEV_BYTES_SOURCE_DIR" \
            -DXGL_DEV_CRC_SOURCE_DIR="$XGL_DEV_CRC_SOURCE_DIR" \
            -DXGL_DEV_MEMORY_SOURCE_DIR="$XGL_DEV_MEMORY_SOURCE_DIR" \
            -DXGL_DEV_CONTAINERS_SOURCE_DIR="$XGL_DEV_CONTAINERS_SOURCE_DIR"
          cmake --build out/arm-${{ matrix.resource }}-${{ matrix.mtu }}-${{ matrix.lto }} --parallel 2
      - name: Enforce the probe budget and retain baseline deltas
        run: |
          python tools/boot_footprint/check_budget.py \
            --report out/arm-${{ matrix.resource }}-${{ matrix.mtu }}-${{ matrix.lto }}/boot-footprint.json \
            --policy tools/boot_footprint/budget-${{ matrix.resource == 'small' && 'small-' || '' }}mtu${{ matrix.mtu }}${{ matrix.lto == 'ON' && '-lto' || '' }}.json \
            --output out/arm-${{ matrix.resource }}-${{ matrix.mtu }}-${{ matrix.lto }}/budget-result.json
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: arm-footprint-${{ matrix.resource }}-${{ matrix.mtu }}-${{ matrix.lto }}
          path: |
            out/arm-${{ matrix.resource }}-${{ matrix.mtu }}-${{ matrix.lto }}/*.json
            out/arm-${{ matrix.resource }}-${{ matrix.mtu }}-${{ matrix.lto }}/*.txt
            out/arm-${{ matrix.resource }}-${{ matrix.mtu }}-${{ matrix.lto }}/*.elf
            out/arm-${{ matrix.resource }}-${{ matrix.mtu }}-${{ matrix.lto }}/*.map
            out/arm-${{ matrix.resource }}-${{ matrix.mtu }}-${{ matrix.lto }}/**/*.su
            out/footprint-lto-contracts/
            out/footprint-advanced-contracts/
          if-no-files-found: error

  status:
    if: always()
    needs: [host, analysis, sanitizers, bounded-profiles, dependency-contracts, arm-footprint]
    runs-on: ubuntu-24.04
    steps:
      - name: Require every selected job to succeed
        env:
          RESULTS: ${{ toJSON(needs) }}
        run: |
          python - <<'PY'
          import json, os
          results = json.loads(os.environ['RESULTS'])
          failed = [name for name, job in results.items() if job['result'] != 'success']
          if failed:
              raise SystemExit('Required jobs did not succeed: ' + ', '.join(failed))
          PY
