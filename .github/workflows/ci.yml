name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  release-validation:
    name: Release validation
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            cmake \
            cppcheck \
            doxygen \
            g++ \
            gcc \
            graphviz \
            ninja-build

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: docs/requirements.txt

      - name: Install documentation dependencies
        run: python -m pip install -r docs/requirements.txt

      - name: Configure
        run: cmake --preset ci

      - name: Run release validation
        run: cmake --build build/ci --target xgl_release_validation --parallel

      - name: Upload footprint report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: xgl-footprint-report
          path: build/ci/footprint/xgl-footprint.txt
          if-no-files-found: ignore

  gcc-smoke:
    name: GCC smoke
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            cmake \
            g++ \
            gcc \
            ninja-build

      - name: Configure
        run: cmake --preset gcc-test

      - name: Build tests and examples
        run: cmake --build build/gcc-test --parallel

      - name: Run CTest
        run: ctest --preset gcc-test --output-on-failure
