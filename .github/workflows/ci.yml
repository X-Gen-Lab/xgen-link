name: CI

on:
  push:
    branches: [main, develop, 'feat/**']
  pull_request:
    branches: [main, develop]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash

jobs:
  host:
    name: Host (${{ matrix.os }}, advanced=${{ matrix.advanced }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2022, macos-15]
        advanced: ['OFF', 'ON']
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'
      - name: Prepare MSVC
        if: runner.os == 'Windows'
        uses: ilammy/msvc-dev-cmd@a102174a2b586eec2ea151a69e6fd14404a8ce7c # v1.13.0
      - uses: ./.github/actions/setup-build
      - uses: ./.github/actions/setup-gtest
      - name: Native C++17 build and individual CTest execution
        run: |
          mkdir -p out/reports
          cmake --preset native-debug -DXGL_ENABLE_ADVANCED_RUNTIME=${{ matrix.advanced }} 2>&1 | tee out/reports/configure.log
          cmake --build --preset native-debug --parallel 2 2>&1 | tee out/reports/build.log
          python test/cmake/run_ctest.py --build-dir build/native-debug --config Debug
      - name: Verify language, discovery and seed replay contracts
        run: |
          binary=build/native-debug/test/xgl_tests
          if [[ "$RUNNER_OS" == Windows ]]; then binary+=.exe; fi
          python test/contracts/ctest/test_runner_contracts.py --build-dir build/native-debug --binary "$binary"
      - name: Exercise the Full Wire v1 peer exchange
        run: |
          peer=build/native-debug/test/xgl_interop_peer
          if [[ "$RUNNER_OS" == Windows ]]; then peer+=.exe; fi
          python test/interop/test_wire_interop.py "$peer" "$peer" --profile full \
            --transcript out/reports/wire-v1.log
      - name: Preserve host evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: host-${{ matrix.os }}-${{ matrix.advanced }}
          path: |
            out/reports/
            build/native-debug/Testing/
            build/native-debug/compile_commands.json
            build/native-debug/ctest.xml
            build/native-debug/ctest-inventory.json
          if-no-files-found: warn

  gcc-validation:
    name: Full Advanced GCC validation
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - uses: ./.github/actions/setup-build
      - uses: ./.github/actions/setup-gtest
      - name: Build instrumented real protocol
        run: |
          mkdir -p out/reports
          cmake --preset ci 2>&1 | tee out/reports/configure.log
          cmake --build --preset ci --parallel 2 2>&1 | tee out/reports/build.log
          python test/cmake/run_ctest.py --build-dir build/ci --config Debug
      - name: Record native library size
        run: cmake --build build/ci --target xgl_footprint
      - name: Preserve GCC validation evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: gcc-validation
          path: |
            out/reports/
            build/ci/Testing/
            build/ci/ctest.xml
            build/ci/ctest-inventory.json
            build/ci/compile_commands.json
            build/ci/footprint/
          if-no-files-found: warn

  sanitizers:
    name: Address and undefined behavior sanitizers
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - uses: ./.github/actions/setup-build
      - uses: ./.github/actions/setup-gtest
      - name: Build and check every selected executable
        run: |
          mkdir -p out/reports
          cmake --preset native-asan -DXGL_ENABLE_ADVANCED_RUNTIME=ON 2>&1 | tee out/reports/configure.log
          cmake --build --preset native-asan --parallel 2 2>&1 | tee out/reports/build.log
          python test/cmake/run_ctest.py --build-dir build/native-asan --config Debug
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: sanitizers
          path: |
            out/reports/
            build/native-asan/Testing/
            build/native-asan/ctest.xml
            build/native-asan/ctest-inventory.json
          if-no-files-found: warn

  bounded-profiles:
    name: Bounded profile (${{ matrix.preset }}, advanced=${{ matrix.advanced }})
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        preset: [boot-host-test, embedded-lite-host-test, embedded-host-test]
        advanced: ['OFF', 'ON']
        include:
          - preset: boot-small-host-test
            advanced: 'OFF'
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - uses: ./.github/actions/setup-build
      - uses: ./.github/actions/setup-gtest
      - name: Build and test the bounded preset
        env:
          PRESET: ${{ matrix.preset }}
          ADVANCED: ${{ matrix.advanced }}
        run: |
          mkdir -p out/reports
          cmake --preset "$PRESET" -DXGL_ENABLE_ADVANCED_RUNTIME="$ADVANCED" 2>&1 | tee out/reports/configure.log
          cmake --build --preset "$PRESET" --parallel 2 2>&1 | tee out/reports/build.log
          python test/cmake/run_ctest.py --build-dir "build/$PRESET" --config MinSizeRel
      - name: Exercise the Boot Wire v1 peer exchange
        if: matrix.preset == 'boot-host-test' || matrix.preset == 'boot-small-host-test'
        run: |
          peer=build/${{ matrix.preset }}/test/xgl_interop_peer
          python test/interop/test_wire_interop.py "$peer" "$peer" --profile boot \
            --transcript out/reports/wire-v1.log
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: bounded-${{ matrix.preset }}-${{ matrix.advanced }}
          path: |
            out/reports/
            build/${{ matrix.preset }}/Testing/
            build/${{ matrix.preset }}/ctest.xml
            build/${{ matrix.preset }}/ctest-inventory.json
          if-no-files-found: warn

  dependency-contracts:
    name: Standalone build and package contracts
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - uses: ./.github/actions/setup-build
      - uses: ./.github/actions/setup-gtest
      - name: Check CTest discovery and delivery presets
        run: |
          python test/contracts/ctest/test_discovery_policy.py
          python test/contracts/ctest/test_ctest_evidence.py
          python test/contracts/build/test_delivery_presets.py --work-dir out/reports/delivery-presets
      - name: Validate real source and package consumers
        run: |
          python test/contracts/sdk/dependency_contracts.py \
            --link-source . \
            --work-dir out/reports/dependency-contracts \
            --deny-network
      - name: Validate profiles, package capabilities and Debug/Release consumers
        run: |
          python test/contracts/build/test_profile_builds.py \
            --link-source . \
            --gtest-dir "$GTest_DIR" \
            --work-dir out/reports/profile-contracts
      - name: Validate bounded RX chunk selection and installed configuration
        run: |
          python test/contracts/build/test_rx_chunk_config.py \
            --link-source . \
            --work-dir out/reports/rx-chunk-contracts
      - name: Validate transport capacities, identity and fixed RTO consumers
        run: |
          python test/contracts/build/test_transport_resource_config.py \
            --link-source . \
            --gtest-dir "$GTest_DIR" \
            --work-dir out/reports/transport-resource-contracts
      - name: Preserve contract results
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: dependency-contracts
          path: |
            out/reports/dependency-contracts
            out/reports/profile-contracts
            out/reports/rx-chunk-contracts
            out/reports/transport-resource-contracts
            out/reports/delivery-presets
          if-no-files-found: warn

  wire-compatibility:
    name: Wire v1 interoperability (${{ matrix.profile }})
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        profile: [boot, full]
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - uses: ./.github/actions/setup-build
      - name: Build and run two installed SDK consumers
        env:
          PROFILE: ${{ matrix.profile }}
        run: |
          library="build/wire-sdk-$PROFILE"
          prefix="$PWD/$library/install"
          fixture="out/reports/wire-interop/$PROFILE"
          mkdir -p "$fixture"
          git rev-parse HEAD > "$fixture/source-revision.txt"
          cmake -S . -B "$library" -G Ninja -DCMAKE_BUILD_TYPE=Release -DXGL_PROFILE="$PROFILE" \
            2>&1 | tee "$fixture/sdk-configure.log"
          cmake --build "$library" --parallel 2 2>&1 | tee "$fixture/sdk-build.log"
          cmake --install "$library" --prefix "$prefix" 2>&1 | tee "$fixture/sdk-install.log"
          version=$(sed -n 's/^CMAKE_PROJECT_VERSION:STATIC=//p' "$library/CMakeCache.txt")
          for endpoint in a b; do
            build="build/wire-interop-$PROFILE-$endpoint"
            cmake -S test/interop -B "$build" -G Ninja -DCMAKE_BUILD_TYPE=Release \
              -DXGL_PROFILE="$PROFILE" -DXGL_INTEROP_SDK_PREFIX="$prefix" \
              -DXGL_INTEROP_SDK_VERSION="$version" 2>&1 | tee "$fixture/$endpoint-configure.log"
            cmake --build "$build" --target xgl_interop_peer --parallel 2 2>&1 | tee "$fixture/$endpoint-build.log"
          done
          python test/interop/test_wire_interop.py \
            "build/wire-interop-$PROFILE-a/xgl_interop_peer" "build/wire-interop-$PROFILE-b/xgl_interop_peer" \
            --profile "$PROFILE" --transcript "$fixture/exchange.log"
      - name: Preserve Wire v1 exchange evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: wire-interop-${{ matrix.profile }}
          path: out/reports/wire-interop/${{ matrix.profile }}/
          if-no-files-found: warn

  native-configurations:
    name: Native ${{ matrix.preset }}
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    strategy:
      fail-fast: false
      matrix:
        include:
          - preset: native-release
            configuration: Release
          - preset: native-tsan
            configuration: Debug
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - uses: ./.github/actions/setup-build
      - uses: ./.github/actions/setup-gtest
        with:
          configuration: ${{ matrix.configuration }}
      - name: Execute the complete selected CTest plan
        env:
          PRESET: ${{ matrix.preset }}
        run: |
          prefix=()
          if [[ "$PRESET" == native-tsan ]]; then
            # Keep ASLR changes local to the instrumented configure/build/test subprocesses.
            prefix=(setarch "$(uname -m)" -R)
            export TSAN_OPTIONS=halt_on_error=1
          fi
          "${prefix[@]}" python tools/dev/dev.py configure --preset "$PRESET" --gtest-dir "$GTest_DIR" -- -DXGL_ENABLE_ADVANCED_RUNTIME=ON
          "${prefix[@]}" python tools/dev/dev.py build --preset "$PRESET" --parallel 2
          "${prefix[@]}" python tools/dev/dev.py test --preset "$PRESET"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: ${{ matrix.preset }}
          path: |
            build/${{ matrix.preset }}/developer-commands/
            build/${{ matrix.preset }}/ctest.xml
            build/${{ matrix.preset }}/ctest-inventory.json
          if-no-files-found: warn

  quality:
    name: Required style and static analysis
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Prepare locked maintenance and analysis tools
        run: |
          python -m pip install --only-binary=:all: --require-hashes -r dependencies/python-tools-linux-cp312.txt
          python tools/dev/dev.py prepare --scope workflow --allow-network
          sudo apt-get update
          sudo apt-get install -y clang-14 clang-tidy-14 cppcheck
      - name: Check full repository style and workflows
        run: |
          python scripts/ci/style_gate.py --all --report build/quality/style.json
          python scripts/ci/lint_workflows.py
          python -m unittest discover -s test/contracts/tooling
      - name: Configure, build and analyze Full and Boot Small production targets
        run: |
          for profile in full boot; do
            options=()
            if [[ "$profile" == boot ]]; then
              options+=(-DXGL_TRANSPORT_WINDOW_CAPACITY=1 -DXGL_RELIABLE_INDEX_BUCKETS=1 -DXGL_ENABLE_ADAPTIVE_RTO=OFF)
            else
              options+=(-DXGL_ENABLE_ADVANCED_RUNTIME=ON)
            fi
            dir=build/quality-$profile
            cmake -S . -B "$dir" -G Ninja -DCMAKE_BUILD_TYPE=Release -DCMAKE_EXPORT_COMPILE_COMMANDS=ON \
              "-DXGL_PROFILE=$profile" "${options[@]}"
            cmake --build "$dir" --parallel 2
            python scripts/ci/quality_tools.py tidy --build-dir "$dir" --report "build/quality/tidy-$profile.txt"
            python scripts/ci/quality_tools.py cppcheck --build-dir "$dir" --report "build/quality/cppcheck-$profile.txt"
          done
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: quality
          path: build/quality/
          if-no-files-found: warn

  arm-reference:
    name: ARM Boot SDK reference
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - uses: ./.github/actions/setup-build
      - name: Prepare ARM tools and verify both relocated SDK consumers
        run: |
          sudo apt-get update
          sudo apt-get install -y qemu-system-arm
          arm=$(python tools/dev/dev.py prepare --scope arm --allow-network)
          python test/integration/arm/run.py --toolchain-root "$arm" --work-dir build/arm-reference
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: arm-reference
          path: build/arm-reference/
          if-no-files-found: warn

  status:
    if: always()
    needs: [host, gcc-validation, sanitizers, bounded-profiles, dependency-contracts, wire-compatibility,
            native-configurations, quality, arm-reference]
    runs-on: ubuntu-24.04
    steps:
      - name: Require every selected job to succeed
        env:
          RESULTS: ${{ toJSON(needs) }}
        run: |
          python - <<'PY'
          import json, os
          results = json.loads(os.environ['RESULTS'])
          with open(os.environ['GITHUB_STEP_SUMMARY'], 'a', encoding='utf-8') as summary:
              summary.write(f"## CI gate for `{os.environ['GITHUB_SHA']}`\n\n| Check | Result |\n| --- | --- |\n")
              for name, job in results.items():
                  summary.write(f"| `{name}` | {job['result']} |\n")
          failed = [name for name, job in results.items() if job['result'] != 'success']
          if failed:
              raise SystemExit('Required jobs did not succeed: ' + ', '.join(failed))
          PY
