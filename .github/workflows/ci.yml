name: CI

on:
  push:
    branches: [main, develop, 'feat/**']
  pull_request:
    branches: [main, develop]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash

jobs:
  lint:
    name: Text and source layout
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - uses: ./.github/actions/setup-quality
        with:
          repository: ${{ vars.XGEN_QUALITY_REPOSITORY }}
      - run: python -m pre_commit run --all-files
      - name: Preserve lint evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: lint
          path: out/reports/
          if-no-files-found: warn

  host:
    name: Host (${{ matrix.os }}, advanced=${{ matrix.advanced }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2022, macos-15]
        advanced: ['OFF', 'ON']
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'
      - name: Prepare MSVC
        if: runner.os == 'Windows'
        uses: ilammy/msvc-dev-cmd@a102174a2b586eec2ea151a69e6fd14404a8ce7c # v1.13.0
      - uses: ./.github/actions/setup-gtest
      - name: Native C++17 build and individual CTest execution
        run: |
          mkdir -p out/reports
          cmake --preset debug -DXGL_ENABLE_ADVANCED_RUNTIME=${{ matrix.advanced }} 2>&1 | tee out/reports/configure.log
          cmake --build --preset debug --parallel 2 2>&1 | tee out/reports/build.log
          python test/cmake/run_ctest.py --build-dir build/debug --config Debug
      - name: Verify language, discovery and seed replay contracts
        run: |
          binary=build/debug/test/xgl_tests
          if [[ "$RUNNER_OS" == Windows ]]; then binary+=.exe; fi
          python test/cmake/test_runner_contracts.py --build-dir build/debug --binary "$binary"
      - name: Exercise the Full Wire v3 peer exchange
        run: |
          peer=build/debug/test/xgl_interop_peer
          if [[ "$RUNNER_OS" == Windows ]]; then peer+=.exe; fi
          python test/integration/test_wire_interop.py "$peer" "$peer" --profile full
      - name: Preserve host evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: host-${{ matrix.os }}-${{ matrix.advanced }}
          path: |
            out/reports/
            build/debug/Testing/
            build/debug/compile_commands.json
            build/debug/ctest.xml
            build/debug/ctest-inventory.json
          if-no-files-found: warn

  analysis:
    name: Static analysis and coverage
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - uses: ./.github/actions/setup-gtest
      - name: Build instrumented real protocol
        run: |
          mkdir -p out/reports
          cmake --preset ci 2>&1 | tee out/reports/configure.log
          cmake --build --preset ci --parallel 2 2>&1 | tee out/reports/build.log
          python test/cmake/run_ctest.py --build-dir build/ci --config Debug
      - uses: ./.github/actions/setup-quality
        with:
          repository: ${{ vars.XGEN_QUALITY_REPOSITORY }}
          native-analyzers: 'true'
      - name: Cppcheck through the shared CMake target
        run: cmake --build build/ci --target xgl_static_analysis
      - name: Clang-Tidy
        run: python tools/quality.py tidy --build-dir build/ci
      - name: Require each production coverage metric to reach 80 percent
        run: python tools/quality.py coverage --build-dir build/ci
      - name: Record native library size
        run: cmake --build build/ci --target xgl_footprint
      - name: Preserve analysis evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: analysis-coverage-release
          path: |
            out/reports/
            build/ci/Testing/
            build/ci/ctest.xml
            build/ci/ctest-inventory.json
            build/ci/compile_commands.json
            build/ci/footprint/
          if-no-files-found: warn

  sanitizers:
    name: Address and undefined behavior sanitizers
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - uses: ./.github/actions/setup-gtest
      - name: Build and check every selected executable
        run: |
          mkdir -p out/reports
          cmake --preset asan -DXGL_ENABLE_ADVANCED_RUNTIME=ON 2>&1 | tee out/reports/configure.log
          cmake --build --preset asan --parallel 2 2>&1 | tee out/reports/build.log
          python test/cmake/run_ctest.py --build-dir build/asan --config Debug
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: sanitizers
          path: |
            out/reports/
            build/asan/Testing/
            build/asan/ctest.xml
            build/asan/ctest-inventory.json
          if-no-files-found: warn

  bounded-profiles:
    name: Bounded profile (${{ matrix.preset }}, advanced=${{ matrix.advanced }})
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        preset: [boot-host-test, embedded-lite-host-test, embedded-host-test]
        advanced: ['OFF', 'ON']
        include:
          - preset: boot-small-host-test
            advanced: 'OFF'
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - uses: ./.github/actions/setup-gtest
      - name: Build and test the bounded preset
        env:
          PRESET: ${{ matrix.preset }}
          ADVANCED: ${{ matrix.advanced }}
        run: |
          mkdir -p out/reports
          cmake --preset "$PRESET" -DXGL_ENABLE_ADVANCED_RUNTIME="$ADVANCED" 2>&1 | tee out/reports/configure.log
          cmake --build --preset "$PRESET" --parallel 2 2>&1 | tee out/reports/build.log
          python test/cmake/run_ctest.py --build-dir "build/$PRESET" --config MinSizeRel
      - name: Exercise the Boot Wire v3 peer exchange
        if: matrix.preset == 'boot-host-test' || matrix.preset == 'boot-small-host-test'
        run: |
          peer=build/${{ matrix.preset }}/test/xgl_interop_peer
          python test/integration/test_wire_interop.py "$peer" "$peer" --profile boot
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: bounded-${{ matrix.preset }}-${{ matrix.advanced }}
          path: |
            out/reports/
            build/${{ matrix.preset }}/Testing/
            build/${{ matrix.preset }}/ctest.xml
            build/${{ matrix.preset }}/ctest-inventory.json
          if-no-files-found: warn

  dependency-contracts:
    name: Standalone build and package contracts
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - uses: ./.github/actions/setup-gtest
      - name: Check CTest discovery and footprint tooling
        run: |
          python test/cmake/test_discovery_policy.py
          python test/cmake/test_delivery_presets.py --work-dir out/reports/delivery-presets
          python test/cmake/test_footprint_budget.py
          python test/cmake/test_footprint_storage.py
          python test/cmake/test_footprint_report.py
      - name: Validate real source and package consumers
        run: |
          python test/cmake/dependency_contracts.py \
            --link-source . \
            --work-dir out/reports/dependency-contracts \
            --deny-network
      - name: Validate profiles, package capabilities and Debug/Release consumers
        run: |
          python test/cmake/test_profile_builds.py \
            --link-source . \
            --work-dir out/reports/profile-contracts
      - name: Validate bounded RX chunk selection and installed configuration
        run: |
          python test/cmake/test_rx_chunk_config.py \
            --link-source . \
            --work-dir out/reports/rx-chunk-contracts
      - name: Validate transport capacities, identity and fixed RTO consumers
        run: |
          python test/cmake/test_transport_resource_config.py \
            --link-source . \
            --gtest-dir "$GTest_DIR" \
            --work-dir out/reports/transport-resource-contracts
      - name: Preserve contract results
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: dependency-contracts
          path: |
            out/reports/dependency-contracts
            out/reports/profile-contracts
            out/reports/rx-chunk-contracts
            out/reports/transport-resource-contracts
            out/reports/delivery-presets
          if-no-files-found: warn

  wire-compatibility:
    name: Wire v3 SDK 3 and SDK 4 interoperability
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - uses: ./.github/actions/setup-gtest
      - name: Build and exchange frames with the pinned SDK 3 baseline
        run: |
          mkdir -p out/reports/wire-interop
          for profile in boot full; do
            build="build/wire-interop-$profile"
            fixture="out/reports/wire-interop/$profile"
            mkdir -p "$fixture"
            cmake -S . -B "$build" -G Ninja -DXGL_PROFILE="$profile" -DXGL_BUILD_TESTS=ON 2>&1 | tee "$fixture/configure.log"
            cmake --build "$build" --target xgl_interop_peer --parallel 2 2>&1 | tee "$fixture/build.log"
            work="$RUNNER_TEMP/xgl-interop-$profile"
            python test/integration/build_wire_interop_legacy.py --work-dir "$work" --profile "$profile" --fetch 2>&1 | tee "$fixture/sdk3.log"
            python test/integration/test_wire_interop.py "$work/sdk3-$profile/xgl_interop_peer" "$build/test/xgl_interop_peer" \
              --profile "$profile" --transcript "$fixture/exchange.log"
          done
      - name: Preserve cross-version exchange evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: wire-interop
          path: out/reports/wire-interop/
          if-no-files-found: warn

  arm-footprint:
    name: Cortex-M0 ELF budget (${{ matrix.resource }}, MTU ${{ matrix.mtu }}, LTO ${{ matrix.lto }})
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        mtu: [128, 64]
        lto: ['OFF', 'ON']
        resource: ['default', 'small']
    env:
      ARM_BUILD: out/arm-${{ matrix.resource }}-${{ matrix.mtu }}-${{ matrix.lto }}
      ARM_MTU: ${{ matrix.mtu }}
      ARM_LTO: ${{ matrix.lto }}
      ARM_RESOURCE: ${{ matrix.resource }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - uses: ./.github/actions/setup-arm-toolchain
      - name: Link the fixed no-heap Boot consumer
        run: |
          mkdir -p "$ARM_BUILD"
          cp tools/boot_footprint/toolchain-lock.json "$ARM_BUILD/toolchain-lock.json"
          lto=()
          if [[ "$ARM_LTO" == ON ]]; then lto=(-DXGL_FOOTPRINT_LTO=ON); fi
          cmake -S tools/boot_footprint -B "$ARM_BUILD" -G Ninja \
            -DCMAKE_TOOLCHAIN_FILE="$GITHUB_WORKSPACE/tools/boot_footprint/toolchain-arm-cortex-m0.cmake" \
            -DCMAKE_BUILD_TYPE=MinSizeRel -DCMAKE_EXPORT_COMPILE_COMMANDS=ON "${lto[@]}" \
            -DXGL_FOOTPRINT_FRAME_SIZE="$ARM_MTU" -DXGL_FOOTPRINT_RX_SIZE="$ARM_MTU" \
            -DXGL_RELIABLE_INDEX_BUCKETS=1 \
            -DXGL_TRANSPORT_WINDOW_CAPACITY=${{ matrix.resource == 'small' && '1' || '128' }} \
            -DXGL_ENABLE_ADAPTIVE_RTO=${{ matrix.resource == 'small' && 'OFF' || 'ON' }} \
            2>&1 | tee "$ARM_BUILD/configure.log"
          cmake --build "$ARM_BUILD" --parallel 2 2>&1 | tee "$ARM_BUILD/build.log"
      - name: Enforce the probe budget and retain baseline deltas
        run: |
          python tools/boot_footprint/check_budget.py \
            --report "$ARM_BUILD/boot-footprint.json" \
            --policy tools/boot_footprint/budget-${{ matrix.resource == 'small' && 'small-' || '' }}mtu${{ matrix.mtu }}${{ matrix.lto == 'ON' && '-lto' || '' }}.json \
            --output "$ARM_BUILD/budget-result.json"
      - name: Verify LTO scope in the existing link
        if: matrix.resource == 'default' && matrix.mtu == 128
        run: |
          python test/cmake/test_footprint_lto.py --link-source . \
            --work-dir out/footprint-lto-contracts --build-dir "$ARM_BUILD" --expect-lto "$ARM_LTO"
      - name: Compare the classic and bounded APIs in advanced Boot
        if: matrix.resource == 'default' && matrix.mtu == 128 && matrix.lto == 'OFF'
        run: |
          python test/cmake/test_footprint_advanced.py --link-source . \
            --work-dir out/footprint-advanced-contracts
      - name: Summarize measured resources
        if: always()
        run: |
          python - <<'PY'
          import json, os
          from pathlib import Path

          report = Path(os.environ['ARM_BUILD']) / 'budget-result.json'
          with open(os.environ['GITHUB_STEP_SUMMARY'], 'a', encoding='utf-8') as summary:
              summary.write(f"## Cortex-M0 {os.environ['ARM_RESOURCE']} | MTU {os.environ['ARM_MTU']} | LTO {os.environ['ARM_LTO']}\n\n")
              if not report.is_file():
                  summary.write('No budget result. See the configure and build steps.\n')
              else:
                  data = json.loads(report.read_text(encoding='utf-8'))
                  summary.write(f"Budget: **{data['status']}**\n\n| Metric | Bytes | Limit |\n| --- | ---: | ---: |\n")
                  for name, limit in data['limits'].items():
                      summary.write(f"| `{name}` | {data['observed'].get(name, 'missing')} | {limit} |\n")
          PY
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: arm-footprint-${{ matrix.resource }}-${{ matrix.mtu }}-${{ matrix.lto }}
          path: |
            out/arm-${{ matrix.resource }}-${{ matrix.mtu }}-${{ matrix.lto }}/*.json
            out/arm-${{ matrix.resource }}-${{ matrix.mtu }}-${{ matrix.lto }}/*.txt
            out/arm-${{ matrix.resource }}-${{ matrix.mtu }}-${{ matrix.lto }}/*.elf
            out/arm-${{ matrix.resource }}-${{ matrix.mtu }}-${{ matrix.lto }}/*.map
            out/arm-${{ matrix.resource }}-${{ matrix.mtu }}-${{ matrix.lto }}/*.log
            out/arm-${{ matrix.resource }}-${{ matrix.mtu }}-${{ matrix.lto }}/**/*.su
            out/footprint-lto-contracts/
            out/footprint-advanced-contracts/
          if-no-files-found: warn

  status:
    if: always()
    needs: [lint, host, analysis, sanitizers, bounded-profiles, dependency-contracts, wire-compatibility, arm-footprint]
    runs-on: ubuntu-24.04
    steps:
      - name: Require every selected job to succeed
        env:
          RESULTS: ${{ toJSON(needs) }}
        run: |
          python - <<'PY'
          import json, os
          results = json.loads(os.environ['RESULTS'])
          with open(os.environ['GITHUB_STEP_SUMMARY'], 'a', encoding='utf-8') as summary:
              summary.write(f"## CI gate for `{os.environ['GITHUB_SHA']}`\n\n| Check | Result |\n| --- | --- |\n")
              for name, job in results.items():
                  summary.write(f"| `{name}` | {job['result']} |\n")
          failed = [name for name, job in results.items() if job['result'] != 'success']
          if failed:
              raise SystemExit('Required jobs did not succeed: ' + ', '.join(failed))
          PY
