name: Prepare fixed Arm GNU toolchain
description: Install the pinned Linux compiler from a verified archive
runs:
  using: composite
  steps:
    - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
      with:
        path: ${{ runner.temp }}/xgen-arm-toolchain/downloads
        key: xgl-arm-archive-v1-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('tools/boot_footprint/toolchain-lock.json') }}
    - shell: bash
      run: |
        python - <<'PY'
        import hashlib
        import json
        import os
        from pathlib import Path
        import shutil
        import tarfile
        import tempfile
        import urllib.request

        def sha256(path):
            with path.open('rb') as stream:
                return hashlib.file_digest(stream, 'sha256').hexdigest()

        lock = json.loads(Path('tools/boot_footprint/toolchain-lock.json').read_text())
        destination = Path(os.environ['RUNNER_TEMP']) / 'xgen-arm-toolchain'
        archive = destination / 'downloads' / lock['archive']
        archive.parent.mkdir(parents=True, exist_ok=True)

        expected = lock['sha256']
        if archive.exists() and sha256(archive) != expected:
            print('Cached Arm GNU archive checksum mismatch; downloading again')
            archive.unlink()
        if not archive.exists():
            with tempfile.TemporaryDirectory(dir=archive.parent) as temporary:
                partial = Path(temporary) / archive.name
                with urllib.request.urlopen(lock['url'], timeout=120) as response, partial.open('wb') as output:
                    shutil.copyfileobj(response, output)
                if sha256(partial) != expected:
                    raise SystemExit('Arm GNU toolchain checksum mismatch')
                partial.replace(archive)

        install = destination / 'installed'
        install.mkdir(exist_ok=True)
        with tarfile.open(archive, 'r:xz') as bundle:
            bundle.extractall(install, filter='data')
        compilers = list(install.glob('*/bin/arm-none-eabi-gcc'))
        if len(compilers) != 1:
            raise SystemExit('Expected exactly one installed Arm compiler')
        with Path(os.environ['GITHUB_PATH']).open('a', encoding='utf-8') as stream:
            stream.write(str(compilers[0].parent) + '\n')
        print(f"Installed Arm GNU {lock['release']}: {expected}")
        PY
