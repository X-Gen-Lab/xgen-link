name: Prepare GoogleTest
description: Prepare the locked native GoogleTest and GoogleMock package
inputs:
  configuration:
    description: Native configuration used to build the dependency
    default: Debug
runs:
  using: composite
  steps:
    - name: Build and verify GoogleTest using the shared preparation command
      shell: bash
      env:
        XGL_GTEST_CONFIGURATION: ${{ inputs.configuration }}
      run: |
        gtest_dir=$(python tools/dev/dev.py prepare --scope host --allow-network --config "$XGL_GTEST_CONFIGURATION")
        echo "GTest_DIR=$gtest_dir" >> "$GITHUB_ENV"
