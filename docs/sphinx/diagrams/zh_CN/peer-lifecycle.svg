<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 740 406" role="img" aria-label="Peer 状态转换">
<title>Peer 状态转换</title>
<defs><marker id="a" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L8 4 L0 8 Z" fill="#41677d"/></marker></defs>
<style>text{font:18px system-ui,sans-serif;fill:#15334a}.box{fill:#edf4f7;stroke:#41677d;stroke-width:1.5}.arrow{stroke:#41677d;stroke-width:1.5;marker-end:url(#a)}</style>
<rect class="box" x="8" y="7" rx="7" width="146" height="34"/>
<text x="81.0" y="30" text-anchor="middle">●</text>
<line class="arrow" x1="156" y1="36" x2="574" y2="36"/>
<rect class="box" x="579" y="7" rx="7" width="146" height="34"/>
<text x="652.0" y="30" text-anchor="middle">Absent</text>
<rect class="box" x="8" y="64" rx="7" width="146" height="34"/>
<text x="81.0" y="87" text-anchor="middle">Absent</text>
<line class="arrow" x1="156" y1="93" x2="574" y2="93"/>
<text x="365" y="83" text-anchor="middle">接纳精确 scope 或 HELLO</text>
<rect class="box" x="579" y="64" rx="7" width="146" height="34"/>
<text x="652.0" y="87" text-anchor="middle">Active</text>
<rect class="box" x="8" y="121" rx="7" width="146" height="34"/>
<text x="81.0" y="144" text-anchor="middle">Active</text>
<line class="arrow" x1="156" y1="150" x2="574" y2="150"/>
<text x="365" y="140" text-anchor="middle">DATA 或有效 ACK</text>
<rect class="box" x="579" y="121" rx="7" width="146" height="34"/>
<text x="652.0" y="144" text-anchor="middle">Active</text>
<rect class="box" x="8" y="178" rx="7" width="146" height="34"/>
<text x="81.0" y="201" text-anchor="middle">Active</text>
<line class="arrow" x1="156" y1="207" x2="574" y2="207"/>
<text x="365" y="197" text-anchor="middle">RESET / 重试耗尽 / 硬错误</text>
<rect class="box" x="579" y="178" rx="7" width="146" height="34"/>
<text x="652.0" y="201" text-anchor="middle">Failed</text>
<rect class="box" x="8" y="235" rx="7" width="146" height="34"/>
<text x="81.0" y="258" text-anchor="middle">Failed</text>
<line class="arrow" x1="156" y1="264" x2="574" y2="264"/>
<text x="365" y="254" text-anchor="middle">重复 RESET 或 HELLO</text>
<rect class="box" x="579" y="235" rx="7" width="146" height="34"/>
<text x="652.0" y="258" text-anchor="middle">Failed</text>
<rect class="box" x="8" y="292" rx="7" width="146" height="34"/>
<text x="81.0" y="315" text-anchor="middle">Active</text>
<line class="arrow" x1="156" y1="321" x2="574" y2="321"/>
