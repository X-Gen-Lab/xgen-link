<rect class="box" x="579" y="292" rx="7" width="146" height="34"/>
<text x="652.0" y="315" text-anchor="middle">Absent</text>
<rect class="box" x="8" y="349" rx="7" width="146" height="34"/>
<text x="81.0" y="372" text-anchor="middle">Failed</text>
<line class="arrow" x1="156" y1="378" x2="574" y2="378"/>
<text x="365" y="368" text-anchor="middle">显式 close</text>
<rect class="box" x="579" y="349" rx="7" width="146" height="34"/>
