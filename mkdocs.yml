site_name: XGL
site_description: Bounded C11 communication for embedded systems
site_author: X-Gen Lab
site_url: https://x-gen-lab.github.io/xgen-link/
repo_name: xgen-link
repo_url: https://github.com/X-Gen-Lab/xgen-link
docs_dir: docs
site_dir: site
strict: true
exclude_docs: |
  README.md
  CMakeLists.txt
  Doxyfile.in
  requirements.txt

theme:
  name: material
  language: zh
  font: false
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.top
    - navigation.footer
    - content.code.copy
    - content.tabs.link
  palette:
    - scheme: default
      primary: blue grey
      accent: teal

extra:
  alternate:
    - name: 简体中文
      link: zh/
      lang: zh
    - name: English
      link: en/
      lang: en

plugins:
  - search

markdown_extensions:
  - admonition
  - tables
  - toc:
      permalink: true
  - pymdownx.details
  - pymdownx.highlight:
      use_pygments: false
  - pymdownx.snippets
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format

validation:
  nav:
    omitted_files: warn
  links:
    anchors: warn

not_in_nav: |
  /en/reference/protocol/v3/
  /zh/reference/protocol/v3/
  /en/getting-started/build-and-test.md
  /en/getting-started/quick-start.md
  /en/guide/kconfig.md
  /en/guide/modular-migration.md
  /en/guide/porting.md
  /en/guide/thread-safety.md
  /en/protocol/architecture.md
  /en/protocol/codec.md
  /en/protocol/extensions.md
  /en/protocol/reliability.md
  /en/protocol/security.md
  /en/protocol/wire-format.md
  /en/reference/datalink-optimization.md
  /en/reference/public-api.md
  /en/reference/validation-matrix.md
  /en/reference/wire-optimization.md
  /zh/getting-started/build-and-test.md
  /zh/getting-started/quick-start.md
  /zh/guide/kconfig.md
  /zh/guide/modular-migration.md
  /zh/guide/porting.md
  /zh/guide/thread-safety.md
  /zh/protocol/architecture.md
  /zh/protocol/codec.md
  /zh/protocol/extensions.md
  /zh/protocol/reliability.md
  /zh/protocol/security.md
  /zh/protocol/wire-format.md
  /zh/reference/datalink-optimization.md
  /zh/reference/public-api.md
  /zh/reference/validation-matrix.md
